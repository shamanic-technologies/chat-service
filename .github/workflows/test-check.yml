name: Test Coverage Check

on:
  pull_request:
    branches: [main, staging, dev]

jobs:
  check-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if tests were added or updated
        run: |
          BASE_REF="${{ github.event.pull_request.base.sha }}"
          CHANGED_FILES=$(git diff --name-only "$BASE_REF"...HEAD)

          # Check if any source files changed
          SRC_CHANGED=$(echo "$CHANGED_FILES" | grep "^src/" || true)

          # Check if any test files changed
          TEST_CHANGED=$(echo "$CHANGED_FILES" | grep "^tests/.*\.test\.ts$" || true)

          if [ -n "$SRC_CHANGED" ] && [ -z "$TEST_CHANGED" ]; then
            echo "::warning::Source files changed but no test files were added or updated:"
            echo "$SRC_CHANGED"
            echo ""
            echo "Every PR that changes src/ should include regression tests."
            echo "Add tests in tests/unit/ or tests/integration/ to prevent regressions."
            exit 1
          else
            echo "Test check passed."
          fi

  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  test-integration:
    runs-on: ubuntu-latest

    # The database is a container inside the runner: created when the job
    # starts, reachable by nothing else, destroyed with the runner. That is the
    # isolation the per-PR Neon branch existed for, without an API key, an
    # external project, or a delete step that can leave something behind.
    # postgres:17 matches the version the fleet runs in production.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chat_service_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CHAT_SERVICE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/chat_service_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Replays drizzle/*.sql in journal order — the same path the boot migrator
      # runs in production, so CI builds production's schema rather than a diff
      # of it. `drizzle-kit push` is deliberately NOT used: it derives the schema
      # from schema.ts (which this repo hand-authors migrations against, see
      # CLAUDE.md) and it exits 0 after a statement it could not execute.
      - name: Build the schema from the migration journal
        run: ./node_modules/.bin/drizzle-kit migrate

      - name: Run integration tests
        run: npm run test:integration
